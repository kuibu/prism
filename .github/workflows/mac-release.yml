name: mac-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 0.1.1). Empty means use clients/mac/package.json version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
        working-directory: clients/mac
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRISM_MAC_PUBLISH_PROVIDER: github
      PRISM_GH_PRIVATE: "0"
      PRISM_GH_RELEASE_TYPE: release
      PRISM_REQUIRE_SIGNING: "1"
      PRISM_REQUIRE_NOTARIZATION: "1"
      APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/mac/package-lock.json

      - name: Fail fast if release secrets are missing
        run: |
          required=(
            APPLE_DEVELOPER_ID_CERT_P12_BASE64
            APPLE_DEVELOPER_ID_CERT_PASSWORD
            APPLE_API_KEY_P8_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_TEAM_ID
          )
          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key}" ]]; then
              missing+=("$key")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: version
        run: |
          if [[ -n "${RELEASE_INPUT_VERSION}" ]]; then
            version="${RELEASE_INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi

          if [[ -z "${version}" ]]; then
            echo "::error::Unable to resolve release version."
            exit 1
          fi

          npm version "${version}" --no-git-tag-version
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Apple signing and notarization credentials
        run: |
          cert_path="${RUNNER_TEMP}/developer_id_cert.p12"
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"

          echo "${APPLE_DEVELOPER_ID_CERT_P12_BASE64}" | base64 --decode > "${cert_path}"
          echo "${APPLE_API_KEY_P8_BASE64}" | base64 --decode > "${key_path}"

          echo "CSC_LINK=${cert_path}" >> "${GITHUB_ENV}"
          echo "CSC_KEY_PASSWORD=${APPLE_DEVELOPER_ID_CERT_PASSWORD}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}" >> "${GITHUB_ENV}"
          echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}" >> "${GITHUB_ENV}"
          echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "${GITHUB_ENV}"

      - name: Build validation
        run: npm run check

      - name: Build, sign, notarize and publish
        run: npm run dist:mac:publish

      - name: Verify signed + notarized app
        run: |
          APP_PATH="dist/mac-arm64/Prism Desktop.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "::error::App bundle not found: ${APP_PATH}"
            exit 1
          fi
          codesign --verify --deep --strict "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"
          spctl -a -t exec -vv "${APP_PATH}"

      - name: Upload release artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: prism-mac-${{ steps.version.outputs.version }}
          path: |
            clients/mac/dist/*.dmg
            clients/mac/dist/*.zip
            clients/mac/dist/*.blockmap
            clients/mac/dist/latest*.yml
          if-no-files-found: error
