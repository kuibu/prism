[project]
name = "prism-cli"
version = "0.1.0"
description = "Developer CLI for Prism Matrix MVP"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "typer>=0.12.3,<1.0.0",
  "rich>=13.7.1,<14.0.0",
  "matrix-nio>=0.25.2,<1.0.0"
]

[project.scripts]
prism-cli = "prism_cli.main:run"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_cli"]
