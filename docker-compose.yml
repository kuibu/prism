services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: prism_synapse
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-localhost}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS:-no}
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${SYNAPSE_REGISTRATION_SHARED_SECRET:-dev_shared_secret}
    ports:
      - "8008:8008"
    volumes:
      - synapse_data:/data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /data/homeserver.yaml ]; then
          python -m synapse.app.homeserver \
            --server-name "$${SYNAPSE_SERVER_NAME}" \
            --config-path /data/homeserver.yaml \
            --generate-config \
            --report-stats=no
          if ! grep -q "^registration_shared_secret:" /data/homeserver.yaml; then
            echo "registration_shared_secret: \"$${SYNAPSE_REGISTRATION_SHARED_SECRET:-dev_shared_secret}\"" >> /data/homeserver.yaml
          fi
        fi
        if grep -q '^enable_registration:' /data/homeserver.yaml; then
          sed -i "s/^enable_registration:.*/enable_registration: true/" /data/homeserver.yaml
        else
          echo "enable_registration: true" >> /data/homeserver.yaml
        fi
        if grep -q '^enable_registration_without_verification:' /data/homeserver.yaml; then
          sed -i "s/^enable_registration_without_verification:.*/enable_registration_without_verification: true/" /data/homeserver.yaml
        else
          echo "enable_registration_without_verification: true" >> /data/homeserver.yaml
        fi
        # Ensure Synapse client API is reachable from other containers.
        sed -i 's/- ::1/- 0.0.0.0/' /data/homeserver.yaml
        sed -i '/- 127.0.0.1/d' /data/homeserver.yaml
        exec python -m synapse.app.homeserver --config-path /data/homeserver.yaml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8008/_matrix/client/versions', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  immudb:
    image: codenotary/immudb:latest
    container_name: prism_immudb
    restart: unless-stopped
    ports:
      - "${IMMUDB_HOST_PORT:-3332}:3322"
      - "${IMMUDB_ADMIN_HOST_PORT:-9497}:9497"
    volumes:
      - immudb_data:/var/lib/immudb

  opa:
    image: openpolicyagent/opa:latest
    container_name: prism_opa
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ./policies/opa:/policies:ro

  minio:
    image: minio/minio:latest
    container_name: prism_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  gateway_api:
    build:
      context: .
      dockerfile: services/gateway_api/Dockerfile
    container_name: prism_gateway_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_ENV: ${GATEWAY_ENV:-development}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      OPA_URL: ${OPA_URL:-http://opa:8181}
      OPA_POLICY_PATH: ${OPA_POLICY_PATH:-/v1/data/prism/allow}
      OPA_DATA_ROOT: ${OPA_DATA_ROOT:-/v1/data/prism}
      IMMUDB_HOST: ${IMMUDB_HOST:-immudb}
      IMMUDB_PORT: ${IMMUDB_PORT:-3322}
      IMMUDB_TIMEOUT_SECONDS: ${IMMUDB_TIMEOUT_SECONDS:-2.0}
      IMMUDB_RETRY_ATTEMPTS: ${IMMUDB_RETRY_ATTEMPTS:-3}
      IMMUDB_USERNAME: ${IMMUDB_USERNAME:-immudb}
      IMMUDB_PASSWORD: ${IMMUDB_PASSWORD:-immudb}
      IMMUDB_DATABASE: ${IMMUDB_DATABASE:-defaultdb}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-3.0}
      HTTP_RETRY_ATTEMPTS: ${HTTP_RETRY_ATTEMPTS:-3}
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-http://synapse:8008}
    depends_on:
      opa:
        condition: service_started
      immudb:
        condition: service_started
      synapse:
        condition: service_started
    ports:
      - "8080:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  synapse_data:
  immudb_data:
  minio_data:
